<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZsRAG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: Whiteboard-Bühne links (Zeichner, Thema, Wort, Timer), Punktestand rechts, Themenfortschritt darunter. */
  :root {
    --paper: #eef2f5;
    --board: #ffffff;
    --ink: #18212b;
    --muted: #5a6876;
    --line: #d7dee5;
    --chip: #e4eaf0;
    --marker: #1f5fd1;
    --marker-ink: #ffffff;
    --ok: #1d8656;
    --warn: #c83434;
    /* Whiteboard-Marker: Farben für Themen und Spieler */
    --m1: #1f5fd1; --m2: #d6402f; --m3: #1d8656; --m4: #e08a00; --m5: #7b3fd0; --m6: #0f8f9c;
    --m7: #d23f8a; --m8: #8a6a1f; --m9: #3b4cc0;
    --dot: rgba(24, 33, 43, 0.07);
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --m1: #77a2ff; --m2: #ff7a66; --m3: #4fcb91; --m4: #ffb547; --m5: #b48cff; --m6: #4fd2de;
      --m7: #ff7fbf; --m8: #d8b45a; --m9: #8f9bff;
      --dot: rgba(231, 237, 243, 0.06);
      --paper: #0e141a; --board: #161f28; --ink: #e7edf3; --muted: #93a1b0;
      --line: #283441; --chip: #1e2933; --marker: #77a2ff; --marker-ink: #0b1220;
      --ok: #4fcb91; --warn: #ff6f6f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --m1: #77a2ff; --m2: #ff7a66; --m3: #4fcb91; --m4: #ffb547; --m5: #b48cff; --m6: #4fd2de;
    --m7: #ff7fbf; --m8: #d8b45a; --m9: #8f9bff;
    --dot: rgba(231, 237, 243, 0.06);
    --paper: #0e141a; --board: #161f28; --ink: #e7edf3; --muted: #93a1b0;
    --line: #283441; --chip: #1e2933; --marker: #77a2ff; --marker-ink: #0b1220;
    --ok: #4fcb91; --warn: #ff6f6f; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background-color: var(--paper);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100%;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .shell { max-width: 1120px; margin: 0 auto; padding-block: 18px 40px; display: grid; gap: 20px; }

  .brandbox { display: grid; gap: 2px; }
  .tagline-full { margin: 0; font-size: 0.8rem; letter-spacing: 0.02em; color: var(--ink); }
  .tagline-full b { font-weight: 800; }
  .tagline-full .k1 { color: var(--m1); } .tagline-full .k2 { color: var(--m2); } .tagline-full .k3 { color: var(--m3); }
  .tagline-full .k4 { color: var(--m4); } .tagline-full .k5 { color: var(--m5); }
  .foot { display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .foot .ver { font-weight: 600; color: var(--ink); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { font-family: var(--font-display); font-weight: 800; font-size: 2rem; letter-spacing: -0.02em; margin: 0; }
  .brand { display: flex; letter-spacing: 0; }
  .brand span:nth-child(1) { color: var(--m1); }
  .brand span:nth-child(2) { color: var(--m2); font-size: 0.78em; align-self: flex-end; margin-bottom: 0.08em; }
  .brand span:nth-child(3) { color: var(--m3); }
  .brand span:nth-child(4) { color: var(--m4); }
  .brand span:nth-child(5) { color: var(--m5); }
  .brand span:nth-child(6) { color: var(--ink); }
  .pc1 { --c: var(--m1); } .pc2 { --c: var(--m2); } .pc3 { --c: var(--m3); }
  .pc4 { --c: var(--m4); } .pc5 { --c: var(--m5); } .pc6 { --c: var(--m6); }
  .pc7 { --c: var(--m7); } .pc8 { --c: var(--m8); } .pc9 { --c: var(--m9); }
  .badge {
    display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%;
    background: var(--c, var(--muted)); color: var(--board); font-weight: 700; font-size: 0.8rem; font-variant-numeric: tabular-nums;
  }
  .meta { color: var(--muted); font-variant-numeric: tabular-nums; }

  .panel { background: var(--board); border: 1px solid var(--line); border-radius: 14px; padding: 24px; min-width: 0; }
  .eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }
  h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
  h2 { font-size: 1.6rem; }
  h3 { font-size: 1.15rem; }
  p { margin: 0; }

  button {
    font: inherit; font-weight: 500; cursor: pointer;
    border-radius: 9px; padding: 10px 18px;
    border: 1px solid var(--line); background: var(--board); color: var(--ink);
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button.primary { background: var(--marker); border-color: var(--marker); color: var(--marker-ink); font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--marker); }
  button.danger { color: var(--warn); border-color: var(--warn); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }
  input[type="text"] {
    font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; min-width: 0; width: 100%;
  }
  kbd {
    font-family: var(--font-mono); font-size: 0.78em; padding: 1px 6px;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--chip);
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* Setup */
  .setup { display: grid; gap: 22px; max-width: 640px; width: 100%; justify-self: center; }
  .rules { color: var(--muted); max-width: 62ch; }
  .field { display: grid; gap: 10px; border: 0; padding: 0; margin: 0; }
  .field legend { padding: 0; margin-bottom: 10px; font-weight: 600; }
  .players { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .players li { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; }
  .players .jrow { grid-column: 2 / -1; display: flex; gap: 8px; margin-bottom: 6px; }
  .players select {
    flex: 1; min-width: 0; font: inherit; font-size: 0.88rem; color: var(--ink); background: var(--board);
    border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: 7px 10px;
  }
  .players select:focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }
  .reveal-bar { height: 4px; max-width: 320px; margin: 10px auto 0; border-radius: 2px; background: var(--chip); overflow: hidden; }
  .reveal-bar span { display: block; height: 100%; background: var(--c, var(--marker)); transform-origin: left; }
  .players .num { justify-self: center; }
  .players button { padding: 8px 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex-wrap: wrap; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg span { display: block; padding: 9px 16px; font-variant-numeric: tabular-nums; border-right: 1px solid var(--line); }
  .seg label:last-child span { border-right: 0; }
  .seg input:checked + span { background: var(--marker); color: var(--marker-ink); font-weight: 600; }
  .seg input:focus-visible + span { outline: 3px solid var(--marker); outline-offset: -3px; }
  .check { display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--marker); }
  .error { color: var(--warn); font-weight: 500; }

  /* Spiel */
  .game { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 20px; align-items: start; }
  .stage { display: grid; gap: 22px; text-align: center; padding-block: 28px; }
  .drawer { font-size: 1.05rem; }
  .drawer strong { font-family: var(--font-display); font-size: 1.3rem; }
  .topic { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.4rem, 3.4vw, 2rem); }
  .word {
    font-family: var(--font-display); font-weight: 800; line-height: 1.02; letter-spacing: -0.02em;
    font-size: clamp(2.4rem, 8vw, 5.2rem); overflow-wrap: anywhere; transition: filter 0.2s;
  }
  .word { cursor: pointer; border-radius: 12px; }
  .word.veiled {
    color: var(--muted); font-weight: 600; letter-spacing: 0; user-select: none;
    font-size: clamp(1.3rem, 4vw, 2rem); line-height: 1.3;
    border: 2px dashed var(--line); padding: 30px 16px; background: var(--paper);
  }

  .timer { display: grid; gap: 8px; max-width: 520px; width: 100%; justify-self: center; }
  .time { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .track { height: 10px; border-radius: 5px; background: var(--chip); overflow: hidden; }
  .track span { display: block; height: 100%; width: 100%; background: var(--marker); transform-origin: left; }
  .timer.low .time { color: var(--warn); }
  .timer.low .track span { background: var(--warn); }
  .status { min-height: 1.5em; font-weight: 600; }
  .status.ok { color: var(--ok); }
  .status.warn { color: var(--warn); }
  .status.paused { color: var(--muted); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .keys { color: var(--muted); font-size: 0.85rem; }

  .scores { display: grid; gap: 14px; padding: 20px 16px; }
  .scorelist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .scorelist li {
    display: grid; grid-template-columns: 1.1rem minmax(0, 1fr) 2rem auto auto; gap: 6px; align-items: center;
    padding: 8px 10px; border-radius: 10px; background: var(--paper); border: 1px solid transparent;
  }
  .scorelist li.drawing { border-color: var(--line); }
  .scorelist li.winner { border-color: var(--ok); }
  .scorelist .key { justify-self: center; width: 1.45rem; height: 1.45rem; font-size: 0.75rem; }
  .scorelist li.drawing { border-color: var(--c); }
  .scorelist li { border-left: 4px solid var(--c) !important; }
  .scorelist .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scorelist .tag { display: block; font-size: 0.72rem; font-weight: 500; color: var(--muted); }
  .scorelist .pts { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; text-align: right; font-variant-numeric: tabular-nums; }
  .scorelist button { padding: 6px 9px; font-size: 0.85rem; }
  .scorelist .guess { color: var(--ok); border-color: var(--ok); font-weight: 600; }
  .scorelist .minus { color: var(--muted); }

  /* Themenfortschritt */
  .topics { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .chip { background: var(--board); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .chip { border-top: 4px solid var(--c, var(--line)); }
  .chip.active { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); background: color-mix(in srgb, var(--c) 8%, var(--board)); }
  .chip .name::before { content: ""; display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--c); margin-right: 0.4rem; vertical-align: 0.08em; }
  .chip .name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.done .name { color: var(--muted); text-decoration: line-through; }
  .chip .bar { margin-top: 8px; height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; }
  .chip .bar span { display: block; height: 100%; background: var(--c, var(--marker)); }
  .chip.done .bar span { background: var(--ok); }
  .chip .count { margin-top: 4px; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Ende */
  .end { display: grid; gap: 18px; max-width: 560px; width: 100%; justify-self: center; }
  .ranking { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .ranking li { display: grid; grid-template-columns: 2.2rem 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--paper); }
  .ranking li.first { border: 1px solid var(--ok); }
  .ranking .place { font-family: var(--font-display); font-weight: 800; color: var(--muted); }
  .ranking li { border-left: 4px solid var(--c); }
  .stage .topic { color: var(--c, var(--ink)); }
  .seg { justify-self: start; }
  .preview { display: grid; gap: 20px; max-width: 820px; width: 100%; justify-self: center; }
  .preview-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .preview-list li {
    display: grid; gap: 4px; padding: 16px; border-radius: 12px;
    border: 1px solid var(--line); border-top: 5px solid var(--c);
    background: color-mix(in srgb, var(--c) 7%, var(--board));
  }
  .preview-list .pname { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; line-height: 1.25; color: var(--c); text-wrap: balance; }
  .preview-list .pcount { color: var(--muted); font-size: 0.85rem; }
  .setup, .end, .preview {
    background: linear-gradient(90deg, var(--m1) 0 20%, var(--m2) 20% 40%, var(--m3) 40% 60%, var(--m4) 60% 80%, var(--m5) 80%) top / 100% 6px no-repeat, var(--board);
    padding-top: 30px;
  }
  .stage { border-top: 6px solid var(--c, var(--line)); }
  .ranking li.first .place { color: var(--ok); }
  .ranking .pts { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }

  @media (max-width: 900px) {
    .game { grid-template-columns: minmax(0, 1fr); }
    .topics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 480px) {
    .panel { padding: 18px 14px; }
    .topics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .brand { font-size: 1.6rem; }
  }
  @media (prefers-reduced-motion: reduce) { .word { transition: none; } }
  .gen { display: grid; gap: 12px; padding: 14px 16px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); }
  .gen-msg { display: flex; gap: 10px; align-items: center; font-weight: 500; }
  .spinner { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--marker); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  .source { margin: 0; color: var(--muted); font-size: 0.82rem; }
  .top-right { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .sound { padding: 6px 10px; line-height: 0; }
  .sound svg { display: block; }
  .sound[aria-pressed="false"] { color: var(--muted); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--board); }
  .lang button { border: 0; border-radius: 0; padding: 7px 14px; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.04em; }
  .lang button + button { border-left: 1px solid var(--line); }
  .lang button[aria-pressed="true"] { background: var(--marker); color: var(--marker-ink); }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brandbox">
      <h1 class="brand" aria-label="ZsRAG"><span>Z</span><span>s</span><span>R</span><span>A</span><span>G</span><span>.</span></h1>
      <p class="tagline-full"><b class="k1">Z</b>ivil<b class="k2">s</b>chutz <b class="k3">R</b>aclette-<b class="k4">A</b>bend <b class="k5">G</b>ame</p>
    </div>
    <div class="top-right">
      <div class="meta" id="meta"></div>
      <button type="button" class="sound" id="btnSound" aria-pressed="true"></button>
      <div class="lang" id="langSwitch" role="group">
        <button type="button" data-lang="de" lang="de">DE</button>
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="es" lang="es">ES</button>
        <button type="button" data-lang="it" lang="it">IT</button>
        <button type="button" data-lang="pt" lang="pt">PT</button>
      </div>
    </div>
  </header>

  <!-- Einrichtung -->
  <section id="setup" class="panel setup">
    <div>
      <div class="eyebrow" data-i18n="tagline"></div>
      <h2 data-i18n="howTo"></h2>
    </div>
    <p class="rules" id="rules"></p>
    <fieldset class="field">
      <legend data-i18n="playersLegend"></legend>
      <ol class="players" id="playerList"></ol>
      <div class="row">
        <button type="button" id="btnAddPlayer" data-i18n="addPlayer"></button>
      </div>
    </fieldset>
    <fieldset class="field">
      <legend data-i18n="timeLegend"></legend>
      <div class="seg" id="durationSeg">
        <label><input type="radio" name="duration" id="dur30" value="30"><span>30 s</span></label>
        <label><input type="radio" name="duration" id="dur60" value="60" checked><span>60 s</span></label>
        <label><input type="radio" name="duration" id="dur90" value="90"><span>90 s</span></label>
        <label><input type="radio" name="duration" id="dur120" value="120"><span>120 s</span></label>
      </div>
    </fieldset>
    <label class="check"><input type="checkbox" id="drawerPoint" checked> <span data-i18n="drawerPoint"></span></label>
    <p class="error" id="setupError" hidden></p>
    <div class="gen" id="genBox" hidden>
      <p class="gen-msg"><span class="spinner" id="genSpinner" aria-hidden="true"></span><span id="genMsg"></span></p>
      <div class="row">
        <button type="button" class="primary" id="btnRetry"></button>
        <button type="button" id="btnFallback"></button>
        <button type="button" id="btnCancel"></button>
      </div>
    </div>
    <div class="row">
      <button type="button" class="primary" id="btnStart" data-i18n="start"></button>
      <button type="button" id="btnResume" data-i18n="resume" hidden></button>
    </div>
  </section>

  <!-- Spiel -->
  <section id="game" class="game" hidden>
    <div class="panel stage">
      <div class="drawer"><span data-i18n="drawing"></span> <strong id="drawerName">–</strong></div>
      <div>
        <div class="eyebrow" data-i18n="topic"></div>
        <div class="topic" id="topic">–</div>
      </div>
      <div>
        <div class="eyebrow" data-i18n="word"></div>
        <div class="word" id="word">–</div>
        <div class="reveal-bar" id="revealBar" hidden><span></span></div>
      </div>
      <div class="timer" id="timer">
        <div class="time" id="time">0</div>
        <div class="track"><span id="bar"></span></div>
        <div class="status" id="status"></div>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="btnNext" data-i18n="next"></button>
        <button type="button" id="btnPause"></button>
        <button type="button" id="btnVeil"></button>
        <button type="button" id="btnReset"></button>
      </div>
      <p class="keys" id="keysHint"></p>
    </div>
    <aside class="panel scores">
      <h3 data-i18n="scores"></h3>
      <ol class="scorelist" id="scoreList"></ol>
      <p class="keys" data-i18n="scoresHint"></p>
    </aside>
  </section>

  <!-- Themenübersicht vor dem Spiel -->
  <section id="preview" class="panel preview" hidden>
    <div>
      <div class="eyebrow" data-i18n="previewEyebrow"></div>
      <h2 id="previewTitle"></h2>
    </div>
    <p class="rules" data-i18n="previewInfo"></p>
    <ol class="preview-list" id="previewList"></ol>
    <p class="source" id="previewSource"></p>
    <div class="row">
      <button type="button" class="primary" id="btnConfirm" data-i18n="confirm"></button>
      <button type="button" id="btnRegen" data-i18n="regen"></button>
      <button type="button" id="btnBack" data-i18n="back"></button>
    </div>
  </section>

  <!-- Ende -->
  <section id="end" class="panel end" hidden>
    <div>
      <div class="eyebrow" id="endEyebrow"></div>
      <h2 id="endTitle"></h2>
    </div>
    <ol class="ranking" id="ranking"></ol>
    <div class="row">
      <button type="button" class="primary" id="btnAgain" data-i18n="newGame"></button>

  function triple(o) {
    if (!o || typeof o !== "object") return null;
    var out = [o.de, o.en, o.es, o.it, o.pt].map(function (v) { return typeof v === "string" ? v.trim().slice(0, 48) : ""; });

  // Antwort prüfen: höchstens 6 Themen à 10 Wörter, keine doppelten Wörter
  function parseThemes(raw) {
    if (raw && !Array.isArray(raw) && Array.isArray(raw.categories)) raw = raw.categories;
    if (!Array.isArray(raw)) return null;
    var seen = {}, out = [];
    raw.forEach(function (cat) {
      if (out.length >= THEMEN_PRO_SPIEL || !cat) return;
      var name = triple(cat.name);
      if (!name || !Array.isArray(cat.words)) return;
      var words = [];
      cat.words.forEach(function (w) {
        var tr = triple(w);
        if (!tr || words.length >= WOERTER_PRO_THEMA) return;
        var key = tr[0].toLowerCase();
        if (seen[key]) return;
        seen[key] = true;
        words.push(tr);
      });
      if (words.length >= WOERTER_PRO_THEMA) out.push({ name: name, words: words });
    });
    return out.length >= 3 ? out : null;
  }

  async function generateAndStart(names, dur, drawerPoint) {

    clearInterval(genTimer);

    render();
    var sample = await samplePromise;
    if (ctl.signal.aborted) return;
    if (!sample) return genFailed("errUnavailable");
    try {
      var raw = await sample.json(buildPrompt(), { signal: ctl.signal, cache: false, modelTier: "quick" });
      var themen = parseThemes(raw);
      if (!themen) return genFailed("errGenerate");
      clearInterval(genTimer); gen = null;
      rememberTopics(themen);
      showPreview(names, dur, drawerPoint, themen, "claude");
    } catch (e) {

  // Einzelner Ton: Frequenz in Hz, Start relativ zu jetzt, Dauer in s
  function tone(freq, start, dur, type, vol) {
    var t0 = audio.currentTime + start;
    var o = audio.createOscillator(), g = audio.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  // Startschuss beim ersten Aufdecken: kurzer Rauschknall mit tiefem Nachhall
  function startShot() {
    if (!audio || !soundOn) return;
    try {
      var len = Math.floor(audio.sampleRate * 0.6);
      var buf = audio.createBuffer(1, len, audio.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 6);
      var src = audio.createBufferSource(); src.buffer = buf;
      var lp = audio.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400;
      var g = audio.createGain(); g.gain.value = 0.9;
      src.connect(lp); lp.connect(g); g.connect(audio.destination);
      src.start(audio.currentTime);
      tone(70, 0, 0.35, "sine", 0.5);     // Knall-Körper
      tone(140, 0, 0.08, "square", 0.08);
    } catch (e) {}
  }

  // Fanfare beim Ankündigen der Themen: Richard Strauss – Also sprach Zarathustra (Sonnenaufgang),
  // Melodie mit tiefem Orgelpunkt und Pauken
  function playFanfare() {
    if (!audio || !soundOn) return;
    try {
      tone(midi(36), 0, 4.2, "sawtooth", 0.035);                  // Orgelpunkt C
      tone(midi(48), 0, 4.2, "triangle", 0.08);
      [[60, 0, 0.75], [67, 0.75, 0.75], [72, 1.5, 0.75], [76, 2.25, 0.22], [75, 2.47, 1.4]].forEach(function (n) {
        tone(midi(n[0]), n[1], n[2], "square", 0.06);
        tone(midi(n[0]), n[1], n[2], "triangle", 0.16);
        tone(midi(n[0] - 12), n[1], n[2], "triangle", 0.1);
      });
      tone(midi(64), 2.47, 1.4, "triangle", 0.08);                 // Dur-Akkord zum Schluss
      tone(midi(67), 2.47, 1.4, "triangle", 0.08);
      [0, 1, 0, 1, 0, 1, 0, 1].forEach(function (k, i) {             // Pauken C–G
        tone(midi(k ? 43 : 36), 2.5 + i * 0.16, 0.18, "sine", 0.3);
      });
      tone(midi(36), 3.85, 0.5, "sine", 0.35);
    } catch (e) {}
  }
  function playJingle(i, delay) {
    var j = JINGLES[i % JINGLES.length], at = delay || 0;
    if (!audio || !soundOn) return at;
    try {
      j.notes.forEach(function (n, k) {
        if (n !== null) {
          var vol = j.type === "sine" ? 0.24 : j.type === "triangle" ? 0.2 : 0.07;
          tone(midi(n), at, j.lens[k] * 1.05, j.type, vol);
          tone(midi(n + 12), at, j.lens[k] * 0.8, "sine", 0.04);   // leiser Oberton für einen volleren Klang
        }
        at += j.lens[k];
      });
    } catch (e) {}
    return at + 0.3;
  }

  function beep() {
    if (!audio || !soundOn) return;
    try {
      [0, 0.25, 0.5].forEach(function (offset, i) {
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = "sine"; o.frequency.value = i === 2 ? 660 : 880;
        g.gain.setValueAtTime(0.0001, audio.currentTime + offset);
        g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + offset + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + offset + 0.2);
        o.connect(g); g.connect(audio.destination);
        o.start(audio.currentTime + offset); o.stop(audio.currentTime + offset + 0.22);
      });
    } catch (e) {}
  }
  function unlockAudio() {
    try {
      if (!audio) { var C = window.AudioContext || window.webkitAudioContext; if (C) audio = new C(); }
      if (audio && audio.state === "suspended") audio.resume();
    } catch (e) {}
  }

  // ---------- Spiellogik ----------
  function drawerIndex() {
    return typeof state.drawer === "number" ? state.drawer : (state.round - 1) % state.players.length;
  }
  function randInt(n) { return Math.floor(Math.random() * n); }

  function startGame(names, duration, drawerPoint, themen, source) {
    state = {
      players: names.map(function (n, i) { return { name: n, score: 0, jingle: setupJingles[i] }; }),
      duration: duration,
      drawerPoint: drawerPoint,
      themen: themen,
      remaining: themen.map(function (th) { return range(th.words.length); }),
      source: source,
      current: null, round: 0, result: null, finished: false, started: false,
      drawer: randInt(names.length),   // erster Zeichner zufällig
      timer: { running: false, endsAt: 0, leftMs: duration * 1000 }
    };
    nextRound();
  }

  // Zufälliges offenes Thema, daraus ein noch nicht gezogenes Wort
  function nextRound() {
    var open = [];
    state.remaining.forEach(function (r, i) { if (r.length) open.push(i); });
    if (!open.length) {
      pauseTimer();
      state.current = null; state.finished = true;
      save(); render(); playWinnerJingles(); return;
    }
    var ti = open[randInt(open.length)];
    var pool = state.remaining[ti];
    var wi = pool.splice(randInt(pool.length), 1)[0];
    state.current = { t: ti, w: wi };
    // Nächster Zeichner: wer richtig geraten hat; sonst der nächste in der Reihe
    if (state.round > 0) {
      var r = state.result;
      state.drawer = r && r.type === "guessed" ? r.by : (drawerIndex() + 1) % state.players.length;
    }
    state.round += 1;
    state.result = null;
    // Begriff startet verdeckt; der Timer läuft erst nach dem ersten Aufdecken
    state.started = false;
    state.timer = { running: false, endsAt: 0, leftMs: state.duration * 1000 };
    lastTickSec = null;
    veiled = true;
    save(); render();
  }

  function award(i) {
    if (!state || state.finished || state.result || !state.started || i >= state.players.length) return;
    var d = drawerIndex();
    if (i === d) return;
    pauseTimer();
    state.players[i].score += 1;
    if (state.drawerPoint) state.players[d].score += 1;
    var secs = Math.max(1, Math.round((state.duration * 1000 - state.timer.leftMs) / 1000));
    state.result = { type: "guessed", by: i, secs: secs };
    save(); render();
    playJingle(jingleOf(i));
  }

  function toggleVeil() {
    if (!state || state.finished) return;
    veiled = !veiled;
    if (!veiled && !state.started) {
      state.started = true;
      state.timer.running = true;
      state.timer.endsAt = Date.now() + state.timer.leftMs;
      unlockAudio();
      startShot();
      save();
    }
    render();
    if (!veiled) scheduleAutoVeil();
  }

  // Aufgedeckter Begriff wird nach 3 s automatisch wieder verdeckt
  var AUTO_VEIL_MS = 3000;
  var veilTimer = null;
  function scheduleAutoVeil() {
    clearTimeout(veilTimer);
    veilTimer = setTimeout(function () {
      veilTimer = null;
      if (state && !state.finished && !veiled) { veiled = true; render(); }
    }, AUTO_VEIL_MS);
    el.revealBar.hidden = false;
    var bar = el.revealBar.firstElementChild;
    if (bar.animate) {
      bar.getAnimations().forEach(function (a) { a.cancel(); });
      bar.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: AUTO_VEIL_MS, fill: "forwards" });
    }
  }
  function cancelAutoVeil() {
    clearTimeout(veilTimer); veilTimer = null;
    el.revealBar.hidden = true;
  }

  function adjust(i, delta) {
    var p = state.players[i];
    p.score = Math.max(0, p.score + delta);
    save(); render();
  }

  // Spielende: Jingle des Siegers, bei Gleichstand nacheinander alle Sieger
  function playWinnerJingles() {
    var best = Math.max.apply(null, state.players.map(function (p) { return p.score; }));
    var at = 0;
    state.players.forEach(function (p, i) { if (p.score === best) at = playJingle(jingleOf(i), at); });
  }

  function jingleOf(i) { var j = state.players[i].jingle; return typeof j === "number" ? j : i % JINGLES.length; }
  // Neustart: Spieleranzahl und Jingles bleiben, die Namen werden auf die Standardnamen zurückgesetzt
  function namesForSetup() {
    setupJingles = state.players.map(function (p, i) { return jingleOf(i); });
    return state.players.map(function () { return null; });
  }

  function armReset() {
    if (resetArmed) {
      clearTimeout(resetArmed); resetArmed = null;
      setupNames = namesForSetup();
      state = null; clearSaved(); render();
      return;
    }
    resetArmed = setTimeout(function () { resetArmed = null; render(); }, 3000);
    render();
  }

  function setLang(next) {
    if (LANGS.indexOf(next) < 0 || next === lang) return;
    lang = next;
    render();
    // Nach dem Umschalten bleibt der übersetzte Begriff wieder volle 3 s sichtbar
    if (state && !state.finished && !veiled) scheduleAutoVeil();
  }

  // ---------- Einrichtung ----------
  function setupName(i) { return setupNames[i] === null ? t("playerDefault", { n: i + 1 }) : setupNames[i]; }
  function renderSetupPlayers() {
    var focusedId = document.activeElement && document.activeElement.id;
    el.playerList.innerHTML = "";
    setupNames.forEach(function (_, i) {
      var li = document.createElement("li");
      li.className = "pc" + (i % 9 + 1);
      li.innerHTML = '<span class="num badge">' + (i + 1) + '</span>' +
        '<input type="text" maxlength="24" id="player-' + i + '">' +
        '<button type="button" class="remove"></button>' +
        '<div class="jrow"><select id="jingle-' + i + '"></select><button type="button" class="listen"></button></div>';
      var input = li.querySelector("input");
      input.value = setupName(i);
      input.setAttribute("aria-label", t("playerAria", { n: i + 1 }));
      input.addEventListener("input", function () { setupNames[i] = input.value; });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); if (i === setupNames.length - 1) addPlayer(); else focusPlayer(i + 1); }
      });
      var lb = li.querySelector(".listen");
      lb.textContent = t("listen");
      lb.setAttribute("aria-label", t("listenAria", { n: i + 1 }));
      var sel = li.querySelector("select");
      sel.setAttribute("aria-label", t("jingleAria", { n: i + 1 }));
      JINGLES.forEach(function (j, k) {
        var o = document.createElement("option");
        o.value = k; o.textContent = "♪ " + j.title;
        o.disabled = setupJingles.indexOf(k) >= 0 && setupJingles[i] !== k;   // jeder Jingle nur einmal
        sel.appendChild(o);
      });
      sel.value = setupJingles[i];
      function preview() { unlockAudio(); var was = soundOn; soundOn = true; playJingle(setupJingles[i]); soundOn = was; }
      sel.addEventListener("change", function () { setupJingles[i] = parseInt(sel.value, 10); renderSetupPlayers(); preview(); });
      lb.addEventListener("click", preview);
      var btn = li.querySelector(".remove");
      btn.textContent = t("remove");
      btn.setAttribute("aria-label", t("removeAria", { n: i + 1 }));
      btn.disabled = setupNames.length <= MIN_PLAYERS;
      btn.addEventListener("click", function () { setupNames.splice(i, 1); setupJingles.splice(i, 1); renderSetupPlayers(); });
      el.playerList.appendChild(li);
    });
    el.btnAddPlayer.disabled = setupNames.length >= MAX_PLAYERS;
    if (focusedId && /^(player|jingle)-/.test(focusedId) && $(focusedId)) $(focusedId).focus();
  }
  function focusPlayer(i) { var f = $("player-" + i); if (f) { f.focus(); f.select(); } }
  function addPlayer() {
    if (setupNames.length >= MAX_PLAYERS) return;
    setupNames.push(null);
    setupJingles.push(JINGLES.map(function (_, k) { return k; }).filter(function (k) { return setupJingles.indexOf(k) < 0; })[0]);
    renderSetupPlayers();
    focusPlayer(setupNames.length - 1);
  }
  function submitSetup() {
    var names = setupNames.map(function (_, i) { return setupName(i).trim(); });
    if (names.some(function (n) { return !n; })) return showError("errEmpty");
    var lower = names.map(function (n) { return n.toLowerCase(); });
    if (lower.some(function (n, i) { return lower.indexOf(n) !== i; })) return showError("errDup");
    if (names.length < MIN_PLAYERS) return showError("errMin");
    setupError = null;
    var dur = parseInt((document.querySelector('input[name="duration"]:checked') || {}).value || "60", 10);
    unlockAudio();
    generateAndStart(names, dur, el.drawerPoint.checked);
  }
  function showError(key) { setupError = key; render(); }

  // ---------- Darstellung ----------
  function show(section) {
    el.setup.hidden = section !== "setup";
    el.game.hidden = section !== "game";
    el.end.hidden = section !== "end";
    el.preview.hidden = section !== "preview";
  }

  function renderStatic() {
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (node) {
      node.textContent = t(node.getAttribute("data-i18n"));
    });
    Array.prototype.forEach.call(el.langSwitch.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
    });
    el.langSwitch.setAttribute("aria-label", t("lang"));
    // Lautsprechersymbol; bei ausgeschaltetem Ton durchgestrichen
    el.btnSound.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>' +
      (soundOn ? '<path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M3 3l18 18"/>') +
      '</svg>';
    el.btnSound.setAttribute("aria-label", soundOn ? t("soundOn") : t("soundOff"));
    el.btnSound.title = soundOn ? t("soundOn") : t("soundOff");
    el.btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    el.rules.textContent = t("rules");
    renderGen();
    el.keysHint.innerHTML = t("keys");
    el.setupError.hidden = !setupError;
    if (setupError) el.setupError.textContent = t(setupError);
  }

  function renderGen() {
    var on = !!gen && !state;
    el.genBox.hidden = !on;
    el.btnStart.disabled = on && gen.phase === "loading";
    if (!on) return;
    var loading = gen.phase === "loading";
    el.genSpinner.hidden = !loading;
    el.genMsg.textContent = loading
      ? t("loading") + " " + Math.round((Date.now() - gen.started) / 1000) + " s"
      : t(gen.errKey);
    el.btnRetry.hidden = loading || gen.errKey === "errUnavailable";
    el.btnFallback.hidden = loading;
    el.btnCancel.hidden = false;
    el.btnRetry.textContent = t("retry");
    el.btnFallback.textContent = t("useFallback");
    el.btnCancel.textContent = t("cancel");
  }

  function renderPreview() {
    el.previewTitle.textContent = t("previewTitle", { n: pending.themen.length });
    el.previewList.innerHTML = "";
    pending.themen.forEach(function (th, i) {
      var li = document.createElement("li");
      li.className = "pc" + (i % 6 + 1);
      li.innerHTML = '<span class="pname"></span><span class="pcount"></span>';
      li.querySelector(".pname").textContent = th.name[L()];
      li.querySelector(".pcount").textContent = t("wordsCount", { n: th.words.length });
      el.previewList.appendChild(li);
    });
    el.previewSource.textContent = pending.source === "claude" ? t("srcClaude") : t("srcFallback");
  }

  function renderTopics() {
    el.topics.innerHTML = "";
    el.topics.hidden = !state;
    if (!state) return;
    state.themen.forEach(function (th, i) {
      var total = th.words.length;
      var done = total - state.remaining[i].length;
      var chip = document.createElement("div");
      chip.className = "chip pc" + (i % 6 + 1) + (done === total ? " done" : "") +
        (state.current && state.current.t === i ? " active" : "");
      chip.innerHTML = '<div class="name"></div><div class="bar"><span style="width:' + (done / total * 100) +
        '%"></span></div><div class="count">' + done + " / " + total + "</div>";
      chip.querySelector(".name").textContent = topicName(i);
      el.topics.appendChild(chip);
    });
  }

  function renderScores() {
    var d = drawerIndex();
    el.scoreList.innerHTML = "";
    state.players.forEach(function (p, i) {
      var li = document.createElement("li");
      var isWinner = state.result && state.result.type === "guessed" && state.result.by === i;
      li.className = "pc" + (i % 9 + 1) + (i === d ? " drawing" : "") + (isWinner ? " winner" : "");
      li.innerHTML = '<span class="key badge">' + (i + 1) + '</span>' +
        '<span class="name"></span>' +
        '<span class="pts">' + p.score + '</span>' +
        '<button type="button" class="guess"></button>' +
        '<button type="button" class="minus">−</button>';
      var nameEl = li.querySelector(".name");
      nameEl.textContent = p.name;
      if (i === d) { var tag = document.createElement("span"); tag.className = "tag"; tag.textContent = t("tagDrawing"); nameEl.appendChild(tag); }
      if (isWinner) { var tg = document.createElement("span"); tg.className = "tag"; tg.textContent = t("tagWinner"); nameEl.appendChild(tg); }
      var g = li.querySelector(".guess");
      g.textContent = t("guess");
      g.disabled = i === d || !!state.result || !state.started;
      g.addEventListener("click", function () { award(i); });
      var m = li.querySelector(".minus");
      m.setAttribute("aria-label", t("minusAria"));
      m.disabled = p.score === 0;
      m.addEventListener("click", function () { adjust(i, -1); });
      el.scoreList.appendChild(li);
    });
  }

  function renderTimer() {
    if (!state || state.finished) return;
    var ms = leftMs();
    var secs = Math.ceil(ms / 1000);
    el.time.textContent = secs;
    el.bar.style.transform = "scaleX(" + (ms / (state.duration * 1000)) + ")";
    el.timer.classList.toggle("low", secs <= LOW_SECONDS && !state.result);
  }

  function renderStatus() {
    var r = state.result, s = el.status;
    s.className = "status";
    if (r && r.type === "guessed") {
      s.classList.add("ok");
      s.textContent = t("stGuessed", { name: state.players[r.by].name, s: r.secs });
    } else if (r && r.type === "timeout") {
      s.classList.add("warn");
      s.textContent = t("stTimeout");
    } else if (!state.started) {
      s.classList.add("paused");
      s.textContent = t("stVeiled");
    } else if (!state.timer.running) {
      s.classList.add("paused");
      s.textContent = t("stPaused");
    } else {
      s.textContent = "";
    }
    el.btnPause.disabled = !!r || !state.started;
    el.btnPause.textContent = state.timer.running || !state.started ? t("pause") : t("cont");
    el.btnReset.textContent = resetArmed ? t("resetConfirm") : t("reset");
    el.btnReset.classList.toggle("danger", !!resetArmed);
  }

  function renderEnd() {
    var sorted = state.players.slice().sort(function (a, b) { return b.score - a.score; });
    var best = sorted[0].score;
    var winners = sorted.filter(function (p) { return p.score === best; });
    el.endEyebrow.textContent = t("endEyebrow", { n: totalWords() });
    el.endTitle.textContent = winners.length > 1
      ? t("tie", { names: winners.map(function (p) { return p.name; }).join(", ") })
      : t("wins", { name: winners[0].name });
    el.ranking.innerHTML = "";
    var place = 0, last = null;
    sorted.forEach(function (p, i) {
      if (p.score !== last) { place = i + 1; last = p.score; }
      var li = document.createElement("li");
      li.className = "pc" + (state.players.indexOf(p) % 9 + 1) + (place === 1 ? " first" : "");
      li.innerHTML = '<span class="place">' + place + '.</span><span class="name"></span><span class="pts">' +
        p.score + " " + (p.score === 1 ? t("point") : t("points")) + "</span>";
      li.querySelector(".name").textContent = p.name;
      el.ranking.appendChild(li);
    });
  }

  function render() {
    renderStatic();
    renderTopics();
    if (!state) {
      el.meta.textContent = t("metaSetup");
      el.sourceNote.hidden = true;
      if (pending) { show("preview"); renderPreview(); return; }
      show("setup");
      renderSetupPlayers();
      return;
    }
    var total = totalWords();
    var drawn = total - state.remaining.reduce(function (s, r) { return s + r.length; }, 0);
    el.meta.textContent = t("metaGame", { r: state.round, d: drawn, t: total });
    el.sourceNote.hidden = false;
    el.sourceNote.textContent = state.source === "claude" ? t("srcClaude") : t("srcFallback");
    if (state.finished) { show("end"); renderEnd(); return; }

    show("game");
    el.drawerName.textContent = state.players[drawerIndex()].name;
    el.topic.textContent = topicName(state.current.t);
    el.game.querySelector(".stage").className = "panel stage pc" + (state.current.t % 6 + 1);
    el.word.textContent = veiled ? t("veiled") : wordText(state.current.t, state.current.w);
    el.word.classList.toggle("veiled", veiled);
    if (veiled) cancelAutoVeil();
    el.btnVeil.textContent = veiled ? t("reveal") : t("hide");
    renderScores();
    renderStatus();
    renderTimer();
  }

  // ---------- Ereignisse ----------
  el.langSwitch.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (b) setLang(b.getAttribute("data-lang"));
  });
  el.btnSound.addEventListener("click", function () { soundOn = !soundOn; if (soundOn) unlockAudio(); render(); });
  el.btnAddPlayer.addEventListener("click", addPlayer);
  el.btnCancel.addEventListener("click", cancelGen);
  el.btnConfirm.addEventListener("click", confirmPreview);
  el.btnBack.addEventListener("click", function () { pending = null; render(); });
  el.btnRegen.addEventListener("click", function () {
    if (!pending) return;
    var p = pending; pending = null;
    generateAndStart(p.names, p.dur, p.drawerPoint);
  });
  el.btnRetry.addEventListener("click", function () {
    if (!gen) return;
    var g = gen; gen = null;
    generateAndStart(g.names, g.dur, g.drawerPoint);
  });
  el.btnFallback.addEventListener("click", function () {
    if (!gen) return;
    var g = gen; cancelGen();
    showPreview(g.names, g.dur, g.drawerPoint, fallbackThemes(), "fallback");
  });
  el.btnStart.addEventListener("click", submitSetup);
  el.btnNext.addEventListener("click", function () { unlockAudio(); nextRound(); });
  el.btnPause.addEventListener("click", toggleTimer);
  el.btnVeil.addEventListener("click", toggleVeil);
  el.word.addEventListener("click", toggleVeil);
  el.btnReset.addEventListener("click", armReset);
  el.btnAgain.addEventListener("click", function () {
    setupNames = namesForSetup();
    state = null; clearSaved(); render();
  });

  document.addEventListener("keydown", function (e) {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (!state && pending && e.key === "Enter") { e.preventDefault(); confirmPreview(); return; }
    if (!state || state.finished) return;
    if (e.key === "Enter") { e.preventDefault(); unlockAudio(); nextRound(); }
    else if (e.key === " ") { e.preventDefault(); toggleTimer(); }
    else if (e.key === "v" || e.key === "V") { toggleVeil(); }
    else if (/^[1-9]$/.test(e.key)) { award(parseInt(e.key, 10) - 1); }
  });

  // ---------- Start ----------
  function boot(data) {
    if (data && data.state) { state = data.state; veiled = !!data.veiled; if (data.lang) lang = data.lang; }
    else {
      var saved = loadSaved();
      if (saved && !saved.finished) {
        el.btnResume.hidden = false;
        setupNames = saved.players.map(function (p) { return p.name; });
        setupJingles = saved.players.map(function (p, i) { return typeof p.jingle === "number" ? p.jingle : i; });
        el.btnResume.addEventListener("click", function () {
          pauseTimerOf(saved);
          state = saved; veiled = true; unlockAudio(); render();
        });
      }
    }
    render();
    setInterval(tick, 200);
  }
  // Fortgesetztes Spiel startet pausiert
  function pauseTimerOf(s) {
    if (s.timer && s.timer.running) {
      s.timer.leftMs = Math.max(0, s.timer.endsAt - Date.now());
      s.timer.running = false;
      if (s.timer.leftMs === 0 && !s.result) s.result = { type: "timeout" };
    }
  }

  var hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function") {
    hot.snapshot(function () { return { state: state, veiled: veiled, lang: lang }; });
  }
  if (hot && typeof hot.ready === "function") hot.ready(boot);
  else boot(hot && hot.data ? hot.data : {});
})();
</script>
